# Sensor Status Dashboard
# Displays all motion and occupancy sensors grouped by room

title: Sensor Status Dashboard
views:
  - title: Home Sensors
    path: home-sensors
    icon: mdi:home-analytics
    theme: default
    badges: []
    cards:
      # Header Card
      - type: markdown
        content: |
          # 🏠 Home Sensor Status
          **Monitor all motion and occupancy sensors throughout your home**
        style: |
          ha-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px;
            border-radius: 15px;
          }

      # Living Room
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              ## 🛋️ Living Room
            style: |
              ha-card {
                background: rgba(102, 126, 234, 0.1);
                border-left: 4px solid #667eea;
                padding: 5px;
              }
          - type: horizontal-stack
            cards:
              - type: entity
                entity: binary_sensor.living_room_motion
                name: Motion
                icon: mdi:motion-sensor
                style: |
                  ha-card {
                    border-radius: 10px;
                  }
              - type: entity
                entity: binary_sensor.living_room_occupancy
                name: Occupancy
                icon: mdi:account-check
                style: |
                  ha-card {
                    border-radius: 10px;
                  }

