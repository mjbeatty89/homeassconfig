action:
- choose:
  - conditions:
    - condition: trigger
      id: btn1_single
    sequence:
    - choose: []
      default: !input button1_single
    - if:
      - condition: template
        value_template: '{{ debug_enabled }}'
      then:
      - variables:
          action_time: '{{ now().strftime(''%H:%M:%S.%f'')[:-3] }}'
      - service: persistent_notification.create
        data:
          title: "\U0001F518 Button 1 Single"
          message: "⚡ Trigger: {{ trigger_time }} | \U0001F4A5 Action: {{ action_time
            }}"
          notification_id: shelly_btn1_single_{{ action_time }}
  - conditions:
    - condition: trigger
      id: btn1_double
    sequence:
    - choose: []
      default: !input button1_double
    - if:
      - condition: template
        value_template: '{{ debug_enabled }}'
      then:
      - variables:
          action_time: '{{ now().strftime(''%H:%M:%S.%f'')[:-3] }}'
      - service: persistent_notification.create
        data:
          title: "\U0001F518 Button 1 Double"
          message: "⚡ Trigger: {{ trigger_time }} | \U0001F4A5 Action: {{ action_time
            }}"
          notification_id: shelly_btn1_double_{{ action_time }}
  - conditions:
    - condition: trigger
      id: btn1_triple
    sequence:
    - choose: []
      default: !input button1_triple
    - if:
      - condition: template
        value_template: '{{ debug_enabled }}'
      then:
      - variables:
          action_time: '{{ now().strftime(''%H:%M:%S.%f'')[:-3] }}'
      - service: persistent_notification.create
        data:
          title: "\U0001F518 Button 1 Triple"
          message: "⚡ Trigger: {{ trigger_time }} | \U0001F4A5 Action: {{ action_time
            }}"
          notification_id: shelly_btn1_triple_{{ action_time }}
  - conditions:
    - condition: trigger
      id: btn1_down
    sequence:
    - if:
      - condition: template
        value_template: '{{ not button1_dim_enabled }}'
      then:
      - choose: []
        default: !input button1_down
      - if:
        - condition: template
          value_template: '{{ debug_enabled }}'
        then:
        - variables:
            action_time: '{{ now().strftime(''%H:%M:%S.%f'')[:-3] }}'
        - service: persistent_notification.create
          data:
            title: "\U0001F518 Button 1 Down"
            message: "⚡ Trigger: {{ trigger_time }} | \U0001F4A5 Action: {{ action_time
              }}"
            notification_id: shelly_btn1_down_{{ action_time }}
  - conditions:
    - condition: trigger
      id: btn1_up
    sequence:
    - variables:
        dimming_active: false
    - if:
      - condition: template
        value_template: '{{ not button1_dim_enabled }}'
      then:
      - choose: []
        default: !input button1_up
      - if:
        - condition: template
          value_template: '{{ debug_enabled }}'
        then:
        - variables:
            action_time: '{{ now().strftime(''%H:%M:%S.%f'')[:-3] }}'
        - service: persistent_notification.create
          data:
            title: "\U0001F518 Button 1 Up"
            message: "⚡ Trigger: {{ trigger_time }} | \U0001F4A5 Action: {{ action_time
              }}"
            notification_id: shelly_btn1_up_{{ action_time }}
  - conditions:
    - condition: trigger
      id: btn1_long
    sequence:
    - if:
      - condition: template
        value_template: '{{ button1_dim_enabled and button1_dim_target is defined
          and button1_dim_target != '''' }}'
      then:
      - if:
        - condition: template
          value_template: '{{ debug_enabled }}'
        then:
        - variables:
