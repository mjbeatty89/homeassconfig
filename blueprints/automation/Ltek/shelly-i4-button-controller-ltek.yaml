    expert_settings:
      name: Expert Settings
      description: Advanced automation behavior settings. Only change these if you
        understand the implications.
      icon: mdi:tune
      collapsed: true
      input:
        mode_select:
          name: Execution Mode
          description: "Controls what happens when a new button event fires while
            the automation is already running.\n\n\U0001F504 Restart (default) — Stops
            any running instance and starts fresh. Required when using the Dimming
            Function — this is what stops the dim loop when you release the button
            (btn_up). Best for: setups using dimming on any button.\n\n⏸️ Single —
            Ignores new triggers while the automation is running. Useful if your button
            actions contain delays or multi-step sequences and you want to prevent
            them being interrupted by a second press. WARNING: incompatible with dimming
            — the dim loop will never stop because btn_up will be ignored while the
            loop is running.\n\n\U0001F4CB Queued — New triggers wait in line and
            run after the current instance finishes. Useful if you want every press
            to be acted on, even rapid ones. WARNING: incompatible with dimming for
            the same reason as Single.\n\n⚡ Parallel — Every trigger starts a new
            independent instance simultaneously. Useful if buttons are truly independent
            and actions are fast fire-and-forget service calls with no delays. WARNING:
            incompatible with dimming — the dim loop will never stop.\n\n⚠️ If ANY
            button has Dimming enabled, you must use Restart.\n"
          default: restart
          selector:
            select:
              options:
              - label: "\U0001F504 Restart — stops running instance; required for
                  dimming (default)"
                value: restart
              - label: ⏸️ Single — ignores new triggers while running; no dimming
                value: single
              - label: "\U0001F4CB Queued — queues triggers to run in order; no dimming"
                value: queued
              - label: ⚡ Parallel — each trigger runs independently; no dimming
                value: parallel
              sort: false
              custom_value: false
              multiple: false
        debug_enabled:
          name: "\U0001F518 Enable Debug Notifications"
          description: Show combined trigger+action notifications for troubleshooting
            (disable after setup)
          selector:
            boolean: {}
          default: false
mode: !input mode_select
max_exceeded: silent
