blueprint:
  name: "\U0001F4DB Shelly i4 Button Controller by LTek"
  description: "\n\U0001F4DB Shelly i4 Button Controller with scenes and single-button
    dimming and scenes\n\U0001F680 Version 2026.03.01.07c\n✅ Features:\n  - Set any
    HA Action for Button presses (Single, Double, Triple, Down, Up, Long)\n  - Single
    Button Dim any or all buttons (optional)\n  - Dim Direction Start Boundary sets
    dim direction at start of dim; upward if below, downward if above\n  - Dim Fine
    Tuning - Dim Percent per Step, Step Interval (time delay between steps), Transition
    Duration\n  - Debug notifications show trigger and action, with timestamps\n\n\U0001F39A️
    Dim Configuration Guide\"\n    **NOTE...** Dimming starts 1 second after the initial
    press-hold. (native Shelly device detection period for long_press)\n    Default
    values balance dim speed, system latency, and smoothness control for Zigbee lights.\n
    \   \n  - When Dim Function is Enabled, Basic Actions for Button Up and Long Press
    are disabled\n    - if the Light is OFF, Long press turns on the Light then Dims\n\n
    \ These three settings work together to control dimming feel:\n  - Dim Step Percent
    — brightness change per cycle. Smaller = finer steps but slower\n    to traverse
    the full range. Larger = faster but more visible jumps.\n    Default: 14%  \n
    \ - Dim Interval — time between each step. This is the primary speed control.\n
    \   Shorter = faster dimming. \n    Default: 0.2s\n  - Transition Duration — the
    lights own transition between the current and new brightness.\n    Must be LESS
    than Dim Interval or steps will overlap and stutter.\n    Default: 0.0s\n    \n
    \ ⚠️ High-latency lights (Zigbee, Z-Wave): if dimming feels slow despite short
    intervals,\n    set Transition Duration to 0.0 — the light's own fade response
    is adding delay to\n    each loop cycle. The step frequency itself creates perceived
    smoothness.\n\n\U0001F4D6 Community Discussion, Help, and Details... https://community.home-assistant.io/t/shelly-i4-button-controller-by-ltek-with-single-button-dim-multi-press-functions/941400\n"
  source_url: https://gist.github.com/Ltek/27a83afea0a073834052bd055995da4b?permalink_comment_id=5872776#gistcomment-5872776
  domain: automation
  input:
    shelly_device:
      name: "\U0001F4DB Shelly i4 Device"
      selector:
        device:
          integration: shelly
          manufacturer: Shelly
          multiple: false
    button1_basic_actions:
      name: Button 1 - Basic Actions
      description: Configure basic button press actions
      icon: mdi:numeric-1-box
      collapsed: true
      input:
        button1_single:
          name: Single Press
          selector:
            action: {}
          default: []
        button1_double:
          name: Double Press
          selector:
            action: {}
          default: []
        button1_triple:
          name: Triple Press
          selector:
            action: {}
          default: []
        button1_down:
          name: Button Down
          selector:
            action: {}
          default: []
        button1_up:
          name: Button Up
          description: when Dimming Function enabled, this setting is ignored.
          selector:
            action: {}
          default: []
        button1_long:
          name: Long Press
          description: when Dimming Function enabled, this setting is ignored.
          selector:
            action: {}
          default: []
    button1_dim_settings:
      name: Button 1 - Dimming Settings
      description: Configure dimming functionality for long press
      icon: mdi:brightness-6
      collapsed: true
      input:
        button1_dim_enabled:
          name: Enable Dim Function
          description: When enabled the above actions for Long Press and Button Up
            are Disabled
          selector:
            boolean: {}
          default: false
        button1_dim_target:
          name: Light Entity or Group you want to Dim
          selector:
            entity:
              domain:
              - light
              reorder: false
              multiple: false
          default: ''
        button1_dim_step:
          name: Dim Step Percent
          description: Change light Brightness this amount per dim cycle. (1 to 50)
          selector:
            number:
              min: 1.0
              max: 50.0
              unit_of_measurement: '%'
              step: 1.0
              mode: slider
          default: 14
        button1_dim_delay:
          name: Dim Interval (seconds)
          description: Time between each dim cycle. (0.05 to 2.0)
          selector:
            number:
              min: 0.05
              max: 2.0
              unit_of_measurement: seconds
              step: 1.0
              mode: slider
          default: 0.2
        button1_transition:
          name: Transition Duration (seconds)
          description: Duration of brightness transition for each dim step. Set to
            0.0 for Zigbee/Z-Wave lights to avoid latency blocking the dim loop. (0.0
            to 2.0)
          selector:
            number:
              min: 0.0
              max: 2.0
              step: 0.05
              unit_of_measurement: seconds
              mode: slider
          default: 0.0
        button1_boundary:
          name: Dim Boundary Percent
          description: At Dim Start, if the light is Below this Brightness Level,
            the dim will Increase Brightness, otherwise it will Decreases Brightness
          selector:
            number:
              min: 0.0
              max: 100.0
              unit_of_measurement: '%'
              step: 1.0
              mode: slider
          default: 50
    button2_basic_actions:
      name: Button 2 - Basic Actions
