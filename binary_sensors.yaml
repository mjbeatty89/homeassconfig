# Binary Sensors Configuration
# Motion and Occupancy Sensors by Room

# Living Room Sensors
- platform: template
  sensors:
    living_room_motion:
      friendly_name: "Living Room Motion"
      device_class: motion
      value_template: "{{ states('input_boolean.living_room_motion_state') }}"
      icon_template: >-
        {% if is_state('input_boolean.living_room_motion_state', 'on') %}
          mdi:motion-sensor
        {% else %}
          mdi:motion-sensor-off
        {% endif %}

    living_room_occupancy:
      friendly_name: "Living Room Occupancy"
      device_class: occupancy
      value_template: "{{ states('input_boolean.living_room_occupancy_state') }}"
      icon_template: >-
        {% if is_state('input_boolean.living_room_occupancy_state', 'on') %}
          mdi:account-check
        {% else %}
          mdi:account-off
        {% endif %}

