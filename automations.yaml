snow_warning:
    alias: "Critical: Snow Commute Warning"
    description: "Checks forecast when at work and screams if snow is approaching."
    trigger:
      - platform: time_pattern
        minutes: "/30" # Check every 30 minutes
    condition:
      # 1. Only run this if I am actually at work
      - condition: state
        entity_id: device_tracker.matts_iphone # REPLACE THIS
        state: "work" # Ensure your zone is named 'work'
      
      # 2. Only run during likely departure hours (e.g., 1 PM to 5 PM) to save API calls
      - condition: time
        after: "13:00:00"
        before: "17:00:00"
        weekday:
          - mon
          - tue
          - wed
          - thu
          - fri
    
    action:
      # 3. Fetch the forecast (New HA syntax requires this explicit action)
      - action: weather.get_forecasts
        target:
          entity_id: weather.home # REPLACE THIS
        data:
          type: hourly
        response_variable: weather_data
    
      # 4. Logic: Look at the next 4 hours. If ANY hour contains 'snowy', proceed.
      - condition: template
        value_template: >
          {% set next_4_hours = weather_data['weather.home'].forecast[:4] %}
          {{ next_4_hours | selectattr('condition', 'in', ['snowy', 'snowy-rainy']) | list | count > 0 }}
    
      # 5. The Aggressive Notification
      - action: notify.mobile_app_matts_iphone # REPLACE THIS
        data:
          title: "❄️ GET OUT NOW"
          message: "Snow is forecasted in Ann Arbor within 4 hours. Leave immediately or be stuck forever."
          data:
            push:
              sound:
                name: "default"
                critical: 1 # This is the magic key. Bypasses Mute/Do Not Disturb.
                volume: 1.0 # MAX VOLUME.
grouper:    
    alias: "System: Dynamic Asset Grouper v2"
    description: "Builds functional groups for Adaptive Lighting and Presence detection."
    mode: single
    trigger:
      - platform: homeassistant
        event: start
      - platform: event
        event_type: "call_service"
        event_data:
          domain: "automation"
          service: "trigger"
          service_data:
            entity_id: "automation.system_dynamic_asset_grouper_v2"
    
    action:
      - repeat:
          for_each: "{{ areas() }}"
          sequence:
            - variables:
                area_slug: "{{ repeat.item }}"
                
                # 1. PRESENCE SENSORS (Motion/Occupancy/mmWave)
                area_presence: >
                  {{ area_entities(area_slug) 
                     | select('match', 'binary_sensor')
                     | select('search', 'motion|occupancy|presence') 
                     | list }}
                
                # 2. AMBIENT LIGHTS (Tagged 'ambient')
                ambient_lights: >
                  {{ area_entities(area_slug) 
                     | select('match', 'light') 
                     | select('in', label_entities('ambient')) 
                     | list }}
    
                # 3. ADAPTIVE CANDIDATES (Lights - Ambient)
                # Logic: Must be a light, NOT ambient, and usually we'd check for dimming capabilities
                # but 'Not Ambient' is usually the key differentiator.
                adaptive_lights: >
                  {% set all_lights = area_entities(area_slug) | select('match', 'light') | list %}
                  {{ all_lights | reject('in', ambient_lights) | list }}
    
            # --- CREATE GROUPS ---
    
            # Presence Group (Replaces Magic Areas Sensor)
            - if: "{{ area_presence | count > 0 }}"
              then:
                - service: group.set
                  data:
                    object_id: "sensors_presence_{{ area_slug }}"
                    name: "{{ area_name(area_slug) }} Presence"
                    icon: mdi:motion-sensor
                    entities: "{{ area_presence }}"
                    all: false # One sensor triggers the group
    
            # Adaptive Lighting Target Group
            - if: "{{ adaptive_lights | count > 0 }}"
              then:
                - service: group.set
                  data:
                    object_id: "lights_adaptive_{{ area_slug }}"
                    name: "{{ area_name(area_slug) }} Adaptive Target"
                    icon: mdi:theme-light-dark
                    entities: "{{ adaptive_lights }}"
            
            # Ambient Group (for "Chill" modes)
            - if: "{{ ambient_lights | count > 0 }}"
              then:
                - service: group.set
                  data:
                    object_id: "lights_ambient_{{ area_slug }}"
                    name: "{{ area_name(area_slug) }} Ambient"
                    icon: mdi:lamp
                    entities: "{{ ambient_lights }}"
motion:
  alias: "Room Manager: Universal Motion Logic"
  mode: parallel # Allow multiple rooms to trigger simultaneously
  trigger:
    # Trigger on ANY presence group changing state
    - platform: state
      entity_id:
        - group.sensors_presence_office
        - group.sensors_presence_kitchen
        - group.sensors_presence_primary_bedroom
      to: "on"
      id: "motion_active"
    - platform: state
      entity_id:
        - group.sensors_presence_office
        - group.sensors_presence_kitchen
        - group.sensors_presence_primary_bedroom
      to: "off"
      for: "00:05:00" # 5 minute timeout
      id: "motion_clear"
  
  variables:
    # Extract the room slug from the trigger entity (e.g., 'office' from 'group.sensors_presence_office')
    room_slug: "{{ trigger.entity_id.split('_')[-1] }}"
    adaptive_group: "group.lights_adaptive_{{ room_slug }}"
    sleep_switch: "switch.adaptive_lighting_sleep_mode_{{ room_slug }}"
  
  condition:
    # Block motion activation if Sleep Mode is ON for that room
    - condition: template
      value_template: >
        {% if states(sleep_switch) != 'unknown' %}
          {{ is_state(sleep_switch, 'off') }}
        {% else %}
          true # Default to true if no sleep switch exists for this room
        {% endif %}
  
  action:
    - choose:
        # --- Motion Detected ---
        - conditions:
            - condition: trigger
              id: "motion_active"
          sequence:
            - service: light.turn_on
              target:
                entity_id: "{{ adaptive_group }}"
              # Note: No brightness/color data here. Adaptive Lighting integration picks this up immediately.
  
        # --- Motion Cleared ---
        - conditions:
            - condition: trigger
              id: "motion_clear"
          sequence:
            - service: light.turn_off
              target:
                entity_id: "{{ adaptive_group }}"
              data:
                transition: 2
lightcycle:                
  alias: "System: Cycle Room Light Selection"
  description: "Cycles the 'Cursor' to the next light in the room's adaptive group."
  fields:
    room_slug:
      description: "The room identifier (e.g., office)"
      example: "office"
  sequence:
    - variables:
        # 1. Define Context
        group_entity: "group.lights_adaptive_{{ room_slug }}"
        helper_entity: "input_text.selected_light_{{ room_slug }}"
        
        # 2. Get the list of entity_ids in the group
        entity_list: "{{ state_attr(group_entity, 'entity_id') }}"
        
        # 3. Get the currently selected light (from the helper)
        current_selection: "{{ states(helper_entity) }}"
        
        # 4. Calculate the NEXT index
        # If current selection isn't in list (or is empty), start at 0.
        next_index: >
          {% if current_selection in entity_list %}
            {% set idx = entity_list.index(current_selection) %}
            {% set next_idx = idx + 1 %}
            {% if next_idx >= entity_list | length %} 0 {% else %} {{ next_idx }} {% endif %}
          {% else %}
            0
          {% endif %}
        
        # 5. Identify the Next Entity ID
        next_entity: "{{ entity_list[next_index] }}"
  
    # 6. Update the Helper
    - service: input_text.set_value
      target:
        entity_id: "{{ helper_entity }}"
      data:
        value: "{{ next_entity }}"
  
    # 7. Visual Feedback: Flash the newly selected light
    - service: light.turn_on
      target:
        entity_id: "{{ next_entity }}"
      data:
        flash: "short"
wantConnect:
  alias: "Controller: Office IKEA Remote"
  trigger:
    - platform: state
      entity_id: sensor.ikea_4_button_remote_action # Replace with your actual Zigbee2MQTT action entity
  action:
    - variables:
        room_slug: "office"
        selection_helper: "input_text.selected_light_office"
        
    - choose:
        # --- Button: Right Arrow (Cycle Next) ---
        - conditions: "{{ trigger.to_state.state == 'arrow_right_click' }}"
          sequence:
            - service: script.system_cycle_room_light_selection
              data:
                room_slug: "{{ room_slug }}"
  
        # --- Button: Dim Up (Control Selected) ---
        - conditions: "{{ trigger.to_state.state == 'brightness_up_hold' }}"
          sequence:
            - service: light.turn_on
              target:
                entity_id: "{{ states(selection_helper) }}" # TARGETS THE DYNAMIC CURSOR
              data:
                brightness_step_pct: 10
  
        # --- Button: Dim Down (Control Selected) ---
        - conditions: "{{ trigger.to_state.state == 'brightness_down_hold' }}"
          sequence:
            - service: light.turn_on
              target:
                entity_id: "{{ states(selection_helper) }}"
              data:
                brightness_step_pct: -10
                
        # --- Button: Toggle (Control Selected) ---
        - conditions: "{{ trigger.to_state.state == 'on' }}"
          sequence:
            - service: light.toggle
              target:
                entity_id: "{{ states(selection_helper) }}"
