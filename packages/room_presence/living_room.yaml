# packages/room_presence/living_room.yaml
# =========================================
# Room: Living Room
# Presence Package — Quinn's Domain
# =========================================
# Pattern: Presence group → occupancy binary sensor (delay_off 3 min) →
#           light follow automation
#
# Requires: group.sensors_presence_living_room (built by Dynamic Asset Grouper)
#           group.lights_adaptive_living_room  (built by Dynamic Asset Grouper)

template:
  - binary_sensor:
      - name: "Living Room Occupied"
        unique_id: room_occupied_living_room
        device_class: occupancy
        delay_off: "00:03:00"
        state: >
          {{ is_state('group.sensors_presence_living_room', 'on') }}
        availability: >
          {{ states('group.sensors_presence_living_room') not in ['unknown', 'unavailable'] }}

automation:
  - alias: "Room: Living Room Light Follow"
    id: room_light_follow_living_room
    description: >
      Turns adaptive lights on when Living Room is occupied,
      off with a 2s fade when vacant.
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.living_room_occupied
        to: "on"
        id: occupied
      - platform: state
        entity_id: binary_sensor.living_room_occupied
        to: "off"
        id: vacant
    condition:
      # Don't override if sleep mode is active on this zone
      - condition: template
        value_template: >
          {{ states('switch.adaptive_lighting_sleep_mode_living_room')
             not in ['on'] }}
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: occupied
              - condition: state
                entity_id: input_boolean.room_automation_enabled_living_room
                state: "on"
              - condition: state
                entity_id: input_boolean.room_manual_hold_living_room
                state: "off"
            sequence:
              - action: script.room_apply_scene_living_room
                data:
                  scene_name: Auto
          - conditions:
              - condition: trigger
                id: vacant
              - condition: state
                entity_id: input_boolean.room_automation_enabled_living_room
                state: "on"
              - condition: state
                entity_id: input_boolean.room_manual_hold_living_room
                state: "off"
            sequence:
              - action: light.turn_off
                target:
                  entity_id:
                    - group.lights_adaptive_living_room
                    - group.lights_ambient_living_room
                data:
                  transition: 2
