# packages/room_presence/office.yaml
# =========================================
# Room: Office
# Presence Package — Axiom's Domain
# =========================================
# Pattern: Presence group → occupancy binary sensor (delay_off 5 min,
#           longer for focused work sessions) → light follow automation
#
# Requires: group.sensors_presence_office (built by Dynamic Asset Grouper)
#           group.lights_adaptive_office  (built by Dynamic Asset Grouper)

template:
  - binary_sensor:
      - name: "Office Occupied"
        unique_id: room_occupied_office
        device_class: occupancy
        delay_off: "00:05:00"   # 5-min grace — avoid interruptions during focused work
        state: >
          {{ is_state('group.sensors_presence_office', 'on') }}
        availability: >
          {{ states('group.sensors_presence_office') not in ['unknown', 'unavailable'] }}

automation:
  - alias: "Room: Office Light Follow"
    id: room_light_follow_office
    description: >
      Turns adaptive lights on when Office is occupied,
      off with a 2s fade when vacant.
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.office_occupied
        to: "on"
        id: occupied
      - platform: state
        entity_id: binary_sensor.office_occupied
        to: "off"
        id: vacant
    condition:
      - condition: template
        value_template: >
          {{ states('switch.adaptive_lighting_sleep_mode_office')
             not in ['on'] }}
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: occupied
              - condition: state
                entity_id: input_boolean.room_automation_enabled_office
                state: "on"
              - condition: state
                entity_id: input_boolean.room_manual_hold_office
                state: "off"
            sequence:
              - action: script.room_apply_scene_office
                data:
                  scene_name: Auto
          - conditions:
              - condition: trigger
                id: vacant
              - condition: state
                entity_id: input_boolean.room_automation_enabled_office
                state: "on"
              - condition: state
                entity_id: input_boolean.room_manual_hold_office
                state: "off"
            sequence:
              - action: light.turn_off
                target:
                  entity_id:
                    - group.lights_adaptive_office
                    - group.lights_ambient_office
                data:
                  transition: 2
