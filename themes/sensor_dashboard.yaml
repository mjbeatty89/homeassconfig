# Custom theme for sensor dashboard
Sensor Dashboard Theme:
  # Main colors
  primary-color: "#667eea"
  accent-color: "#764ba2"
  
  # Background colors
  primary-background-color: "#fafafa"
  secondary-background-color: "#e8eaf6"
  
  # Text colors
  primary-text-color: "#212121"
  secondary-text-color: "#727272"
  disabled-text-color: "#bdbdbd"
  
  # Card styling
  card-background-color: "#ffffff"
  ha-card-border-radius: "12px"
  ha-card-box-shadow: "0 2px 8px rgba(0,0,0,0.1)"
  
  # State colors
  state-icon-color: "#667eea"
  state-icon-active-color: "#4caf50"
  state-icon-unavailable-color: "#bdbdbd"
  
  # Paper colors
  paper-item-icon-color: "#667eea"
  paper-item-icon-active-color: "#4caf50"
  
  # Sidebar
  sidebar-background-color: "#ffffff"
  sidebar-icon-color: "#667eea"
  sidebar-selected-icon-color: "#764ba2"
  sidebar-selected-text-color: "#764ba2"
