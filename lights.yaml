# ═══════════════════════════════════════════════════════════════════
# Living Room Lights
# ═══════════════════════════════════════════════════════════════════

# Main Ceiling Light - Harsh Lighting
- platform: template
  lights:
    living_room_main:
      friendly_name: "Living Room Main Light"
      unique_id: living_room_main_light
      turn_on:
        service: light.turn_on
        target:
          entity_id: light.living_room_main_bulb
      turn_off:
        service: light.turn_off
        target:
          entity_id: light.living_room_main_bulb

