# Homeassconfig Workflow Automated Fix For Pull Request Findings

## Action

Follow the automated-fix-for-pull-request-findings workflow:
1. Receive pull request review with findings.
2. Apply automated or manual fix to the identified file.
3. Commit the change with a message referencing the pull request finding and Copilot Autofix.

