# Homeassconfig Workflow Secrets And Sensitive Content Purge

## Action

Follow the secrets-and-sensitive-content-purge workflow:
1. Identify and remove all files containing secrets or sensitive data.
2. Update .gitignore to prevent future leaks.
3. Add documentation (e.g., SECRETS_ROTATION.md) with rotation and cleanup procedures.
4. Commit all removals and documentation updates.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: .gitignore, SECRETS_ROTATION.md, various sensitive files (e.g., *.pem, .storage_backup_before_recovery/, theme packs, blueprints, logs)

