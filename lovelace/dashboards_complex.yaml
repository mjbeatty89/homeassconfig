# ╔═══════════════════════════════════════════════════════════════════╗
# ║                     Complex Dashboards                             ║
# ║              One View Per Room - Detailed & Advanced               ║
# ╚═══════════════════════════════════════════════════════════════════╝

title: Complex View
views:
  # ═════════════════════════════════════════════════════════════════
  # Living Room - Complex View
  # ═════════════════════════════════════════════════════════════════
  - title: Living Room
    path: living-room-complex
    icon: mdi:sofa
    badges:
      - entity: sensor.living_room_temperature
      - entity: sensor.living_room_humidity
      - entity: sensor.living_room_comfort_level
      - entity: sensor.living_room_energy_usage
    cards:
      # Complete Status Overview
      - type: entities
        title: Complete Environment Status
        show_header_toggle: false
        entities:
          - entity: sensor.living_room_temperature
            name: Temperature
            icon: mdi:thermometer
          - entity: binary_sensor.living_room_temperature_high
            name: Temperature High Alert
          - entity: binary_sensor.living_room_temperature_low
            name: Temperature Low Alert
          - type: divider
          - entity: sensor.living_room_humidity
            name: Humidity
            icon: mdi:water-percent
          - entity: binary_sensor.living_room_humidity_high
            name: Humidity High Alert
          - entity: binary_sensor.living_room_humidity_low
            name: Humidity Low Alert
          - type: divider
          - entity: sensor.living_room_air_quality
            name: Air Quality Index
          - entity: binary_sensor.living_room_poor_air_quality
            name: Poor Air Quality Alert
          - type: divider
          - entity: sensor.living_room_illuminance
            name: Light Level
          - entity: binary_sensor.living_room_too_dark
            name: Too Dark
          - entity: binary_sensor.living_room_too_bright
            name: Too Bright

      # Advanced Lighting Control
      - type: entities
        title: Advanced Lighting Control
        show_header_toggle: false
        entities:
          - type: section
            label: Main Lights (Harsh)
          - entity: light.living_room_main
            name: Main Ceiling Light
            icon: mdi:ceiling-light
          - entity: binary_sensor.living_room_harsh_lights_on
            name: Any Harsh Light On
          - type: section
            label: Ambient Lights (Soft)
          - entity: light.living_room_lamp_left
            name: Left Lamp
            icon: mdi:lamp
          - entity: light.living_room_lamp_right
            name: Right Lamp
            icon: mdi:lamp
          - entity: light.living_room_led_strip
            name: LED Strip
            icon: mdi:led-strip-variant
          - entity: binary_sensor.living_room_soft_lights_on
            name: Any Soft Light On
          - type: divider
          - entity: sensor.living_room_light_state
            name: Overall Light Status
          - entity: binary_sensor.living_room_lights_on
            name: Any Light On

      # Comfort & Analytics
      - type: entities
        title: Comfort Analysis
        show_header_toggle: false
        entities:
          - entity: sensor.living_room_comfort_level
            name: Comfort Level
            icon: mdi:emoticon
          - entity: binary_sensor.living_room_comfortable
            name: Is Comfortable
          - type: divider
          - entity: sensor.living_room_energy_usage
            name: Current Energy Usage
            icon: mdi:flash
          - entity: binary_sensor.living_room_occupied
            name: Room Occupied

      # Historical Graph
      - type: history-graph
        title: Living Room History
        hours_to_show: 24
        entities:
          - entity: sensor.living_room_temperature
          - entity: sensor.living_room_humidity
          - entity: sensor.living_room_air_quality

      # Energy Graph
      - type: history-graph
        title: Living Room Energy Usage
        hours_to_show: 24
        entities:
          - entity: sensor.living_room_energy_usage

  # ═════════════════════════════════════════════════════════════════
  # Kitchen - Complex View
  # ═════════════════════════════════════════════════════════════════
  - title: Kitchen
    path: kitchen-complex
    icon: mdi:chef-hat
    badges:
      - entity: sensor.kitchen_temperature
      - entity: sensor.kitchen_humidity
      - entity: sensor.kitchen_safety_status
      - entity: binary_sensor.kitchen_safe
    cards:
      # Complete Status Overview
      - type: entities
        title: Complete Environment Status
        show_header_toggle: false
        entities:
          - entity: sensor.kitchen_temperature
            name: Temperature
          - entity: binary_sensor.kitchen_temperature_high
            name: Temperature High Alert
          - entity: binary_sensor.kitchen_temperature_low
            name: Temperature Low Alert
          - type: divider
          - entity: sensor.kitchen_humidity
            name: Humidity
          - entity: binary_sensor.kitchen_humidity_high
            name: Humidity High Alert

      # Safety Monitoring
      - type: entities
        title: Safety Monitoring System
        show_header_toggle: false
        entities:
          - entity: sensor.kitchen_safety_status
            name: Overall Safety Status
            icon: mdi:shield-check
          - entity: binary_sensor.kitchen_safe
            name: Kitchen Safe
          - type: divider
          - type: section
            label: Gas Detection
          - entity: sensor.kitchen_gas
            name: Gas Level (ppm)
            icon: mdi:gas-cylinder
          - entity: binary_sensor.kitchen_gas_detected
            name: Gas Detected (Alert)
          - entity: binary_sensor.kitchen_gas_warning
            name: Gas Warning Level
          - type: divider
          - type: section
            label: Smoke Detection
          - entity: sensor.kitchen_smoke
            name: Smoke Level (%)
            icon: mdi:smoke-detector
          - entity: binary_sensor.kitchen_smoke_detected
            name: Smoke Detected (Alert)
          - entity: binary_sensor.kitchen_smoke_warning
            name: Smoke Warning Level
          - type: divider
          - entity: binary_sensor.kitchen_safety_alert
            name: Critical Safety Alert

      # Advanced Lighting Control
      - type: entities
        title: Advanced Lighting Control
        show_header_toggle: false
        entities:
          - type: section
            label: Main Lights (Harsh)
          - entity: light.kitchen_ceiling
            name: Ceiling Light
          - entity: light.kitchen_pendant
            name: Pendant Light
          - entity: binary_sensor.kitchen_harsh_lights_on
            name: Any Harsh Light On
          - type: section
            label: Ambient Lights (Soft)
          - entity: light.kitchen_under_cabinet
            name: Under Cabinet Lights
          - entity: binary_sensor.kitchen_soft_lights_on
            name: Soft Lights On
          - type: divider
          - entity: sensor.kitchen_light_state
            name: Overall Light Status
          - entity: sensor.kitchen_energy_usage
            name: Energy Usage

      # Historical Graph
      - type: history-graph
        title: Kitchen Environment History
        hours_to_show: 24
        entities:
          - entity: sensor.kitchen_temperature
          - entity: sensor.kitchen_humidity

      # Safety History
      - type: history-graph
        title: Kitchen Safety History
        hours_to_show: 24
        entities:
          - entity: sensor.kitchen_gas
          - entity: sensor.kitchen_smoke

