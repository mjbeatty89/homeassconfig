# ╔═══════════════════════════════════════════════════════════════════╗
# ║                      Simple Dashboards                             ║
# ║                    One View Per Room - Basic                       ║
# ╚═══════════════════════════════════════════════════════════════════╝

title: Simple View
views:
  # ═════════════════════════════════════════════════════════════════
  # Living Room - Simple View
  # ═════════════════════════════════════════════════════════════════
  - title: Living Room
    path: living-room-simple
    icon: mdi:sofa
    badges: []
    cards:
      # Quick Status Card
      - type: entities
        title: Living Room Quick Status
        show_header_toggle: false
        entities:
          - entity: sensor.living_room_temperature
          - entity: sensor.living_room_humidity
          - entity: sensor.living_room_comfort_level
          - entity: binary_sensor.living_room_comfortable

      # Lights Control
      - type: light
        entity: light.living_room_main
        name: Main Light (Harsh)

      - type: light
        entity: light.living_room_lamp_left
        name: Left Lamp (Soft)

      - type: light
        entity: light.living_room_lamp_right
        name: Right Lamp (Soft)

      - type: light
        entity: light.living_room_led_strip
        name: LED Strip (Soft)

      # Environment Status
      - type: glance
        title: Environment
        entities:
          - entity: sensor.living_room_air_quality
            name: Air Quality
          - entity: sensor.living_room_illuminance
            name: Light Level
          - entity: sensor.living_room_energy_usage
            name: Energy Use

  # ═════════════════════════════════════════════════════════════════
  # Kitchen - Simple View
  # ═════════════════════════════════════════════════════════════════
  - title: Kitchen
    path: kitchen-simple
    icon: mdi:chef-hat
    badges: []
    cards:
      # Quick Status Card
      - type: entities
        title: Kitchen Quick Status
        show_header_toggle: false
        entities:
          - entity: sensor.kitchen_temperature
          - entity: sensor.kitchen_humidity
          - entity: sensor.kitchen_safety_status
          - entity: binary_sensor.kitchen_safe

      # Lights Control
      - type: light
        entity: light.kitchen_ceiling
        name: Ceiling Light (Harsh)

      - type: light
        entity: light.kitchen_under_cabinet
        name: Under Cabinet (Soft)

      - type: light
        entity: light.kitchen_pendant
        name: Pendant Light (Harsh)

      # Safety Status
      - type: glance
        title: Safety
        entities:
          - entity: sensor.kitchen_gas
            name: Gas Level
          - entity: sensor.kitchen_smoke
            name: Smoke Level
          - entity: binary_sensor.kitchen_safety_alert
            name: Alert Status

  # ═════════════════════════════════════════════════════════════════
  # Bedroom - Simple View
  # ═════════════════════════════════════════════════════════════════
  - title: Bedroom
    path: bedroom-simple
    icon: mdi:bed
    badges: []
    cards:
      # Quick Status Card
      - type: entities
        title: Bedroom Quick Status
        show_header_toggle: false
        entities:
          - entity: sensor.bedroom_temperature
          - entity: sensor.bedroom_humidity
          - entity: sensor.bedroom_sleep_environment
          - entity: binary_sensor.bedroom_sleep_ready

      # Lights Control
      - type: light
        entity: light.bedroom_ceiling
        name: Ceiling Light (Harsh)

      - type: light
        entity: light.bedroom_bedside_left
        name: Left Bedside (Soft)

      - type: light
        entity: light.bedroom_bedside_right
        name: Right Bedside (Soft)

      - type: light
        entity: light.bedroom_closet
        name: Closet Light (Harsh)

      # Sleep Environment
      - type: glance
        title: Sleep Environment
        entities:
          - entity: sensor.bedroom_air_quality
            name: Air Quality
          - entity: sensor.bedroom_noise_level
            name: Noise Level
          - entity: binary_sensor.bedroom_comfortable
            name: Comfort

  # ═════════════════════════════════════════════════════════════════
  # Bathroom - Simple View
  # ═════════════════════════════════════════════════════════════════
  - title: Bathroom
    path: bathroom-simple
    icon: mdi:shower
    badges: []
    cards:
      # Quick Status Card
      - type: entities
        title: Bathroom Quick Status
        show_header_toggle: false
        entities:
          - entity: sensor.bathroom_temperature
          - entity: sensor.bathroom_humidity
          - entity: sensor.bathroom_humidity_status
          - entity: binary_sensor.bathroom_ventilation_needed

      # Lights Control
      - type: light
        entity: light.bathroom_ceiling
        name: Ceiling Light (Harsh)

      - type: light
        entity: light.bathroom_mirror
        name: Mirror Light (Soft)

      - type: light
        entity: light.bathroom_shower
        name: Shower Light (Harsh)

      # Alerts
      - type: glance
        title: Alerts
        entities:
          - entity: binary_sensor.bathroom_water_leak_detected
            name: Water Leak
          - entity: binary_sensor.bathroom_mold_risk
            name: Mold Risk
          - entity: binary_sensor.bathroom_shower_active
            name: Shower Active

  # ═════════════════════════════════════════════════════════════════
  # Office - Simple View
  # ═════════════════════════════════════════════════════════════════
  - title: Office
    path: office-simple
    icon: mdi:desk
    badges: []
    cards:
      # Quick Status Card
      - type: entities
        title: Office Quick Status
        show_header_toggle: false
        entities:
          - entity: sensor.office_temperature
          - entity: sensor.office_humidity
          - entity: sensor.office_productivity_environment
          - entity: binary_sensor.office_productive_environment

      # Lights Control
      - type: light
        entity: light.office_ceiling
        name: Ceiling Light (Harsh)

      - type: light
        entity: light.office_desk_lamp
        name: Desk Lamp (Soft)

      - type: light
        entity: light.office_bookshelf
        name: Bookshelf Light (Soft)

      # Work Environment
      - type: glance
        title: Work Environment
        entities:
          - entity: sensor.office_co2
            name: CO2 Level
          - entity: sensor.office_noise_level
            name: Noise Level
          - entity: sensor.office_air_quality_status
            name: Air Quality

  # ═════════════════════════════════════════════════════════════════
  # Hallway - Simple View
  # ═════════════════════════════════════════════════════════════════
  - title: Hallway
    path: hallway-simple
    icon: mdi:door
    badges: []
    cards:
      # Quick Status Card
      - type: entities
        title: Hallway Quick Status
        show_header_toggle: false
        entities:
          - entity: sensor.hallway_temperature
          - entity: binary_sensor.hallway_motion_detected
          - entity: binary_sensor.hallway_night_mode

      # Lights Control
      - type: light
        entity: light.hallway_ceiling
        name: Ceiling Light (Harsh)

      - type: light
        entity: light.hallway_night_light
        name: Night Light (Soft)

      # Status
      - type: glance
        title: Status
        entities:
          - entity: binary_sensor.hallway_occupied
            name: Occupied
          - entity: sensor.hallway_energy_usage
            name: Energy Use
